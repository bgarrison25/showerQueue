<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f7f4">
    <title>You’re offline · ShowerQueue</title>
    <script>
        (() => {
            let theme;
            try { theme = localStorage.getItem('sq-theme'); } catch {}
            theme = ['light', 'dark'].includes(theme) ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name=theme-color]').content = theme === 'dark' ? '#101416' : '#f8f7f4';
        })();
    </script>
    <style>
        :root { color-scheme: light; --bg:#f8f7f4; --surface:#fff; --ink:#292f30; --muted:#5e6869; --border:#dedfda; --accent:#117577; --on-accent:#fff; }
        :root[data-theme=dark] { color-scheme: dark; --bg:#101416; --surface:#1c2022; --ink:#f3f4f2; --muted:#b3b8b8; --border:#383e40; --accent:#9adcb9; --on-accent:#12271e; }
        * { box-sizing:border-box; }
        body { font:16px/1.6 system-ui,sans-serif; margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); }
        main { padding:30px 24px; max-width:400px; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:22px; }
        img { width:60px; border-radius:16px; }
        h1 { font-size:30px; line-height:1.2; font-weight:650; letter-spacing:-1px; }
        p { color:var(--muted); font-size:15px; }
        button { font:inherit; font-weight:600; min-height:48px; background:var(--accent); color:var(--on-accent); padding:12px 26px; border:0; border-radius:12px; margin:12px 0; cursor:pointer; }
        button:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
        .note { font-size:13px; }
    </style>
</head>
<body><main>
    <img src="/icons/icon-192.png" alt="ShowerQueue">
    <h1>You’re offline</h1>
    <p>Reconnect to see the latest schedule and reserve your shower. Your existing reservation is safe.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="note">Reservations need an internet connection.</p>
</main></body>
</html>
